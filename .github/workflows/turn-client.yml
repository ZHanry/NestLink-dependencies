name: TURN client contract
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.96.0'
      - run: cargo test --manifest-path turn-client/Cargo.toml --lib relay_contract_tests
      - run: cargo test --manifest-path turn-client/Cargo.toml --test public_relay_contract
